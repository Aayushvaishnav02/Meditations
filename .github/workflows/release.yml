name: Release (Linux)

on:
  push:
    tags: ["app-v*"]
  workflow_dispatch: # build only, no release — test the pipeline before tagging

permissions:
  contents: write # create the draft release and upload bundles

jobs:
  build-linux:
    # The ubuntu-22.04 runner label is retired (Sept 2026), so run inside an
    # ubuntu:22.04 container on the current runner instead: keeps the glibc
    # 2.35 baseline for older distros and old binutils (no default .relr.dyn
    # sections, which the tauri-pinned linuxdeploy's strip cannot handle)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Bootstrap git + curl (minimal container image; rustup needs curl)
        run: apt-get update && apt-get install -y git curl ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          apt-get update
          apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          if [ "app-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME != app-v$version from tauri.conf.json — bump the version or re-tag."
            exit 1
          fi

      # one-dir PyInstaller bundle; must exist before tauri bundles resources
      - name: Build backend sidecar
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv sync
          uv pip install pyinstaller
          uv run pyinstaller sidecar.spec --noconfirm --distpath ../frontend/src-tauri/binaries
          test -x ../frontend/src-tauri/binaries/meditations-backend/meditations-backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and draft release
        if: startsWith(github.ref, 'refs/tags/')
        # same proven invocation as the branch path; tauri-action died
        # unintrospectably here, so the draft release is handled explicitly
        run: |
          set +e
          npm run tauri build > /tmp/build.log 2>&1
          rc=$?
          if [ $rc -ne 0 ]; then
            echo "build exit=$rc"
            tail -c 5500 /tmp/build.log | fold -w 700 | tail -9 | sed 's/^/::error::/'
          fi
          exit $rc
        working-directory: frontend

      - name: Create draft release and upload bundles
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'EOF'
          import glob, json, os, urllib.request

          repo, tag, token = os.environ["REPO"], os.environ["TAG"], os.environ["GH_TOKEN"]
          api = f"https://api.github.com/repos/{repo}"
          up = f"https://uploads.github.com/repos/{repo}"
          H = {"Authorization": f"Bearer {token}", "Accept": "application/vnd.github+json",
               "User-Agent": "release-upload"}

          def req(url, method="GET", data=None, headers=None):
              h = headers or H
              r = urllib.request.Request(url, method=method, data=data, headers=h)
              with urllib.request.urlopen(r) as resp:
                  body = resp.read()
                  return json.loads(body) if body else {}

          body = """Linux x86_64 builds of Meditations — the backend is bundled, no Python needed.

          **Fedora / RHEL** — `sudo dnf install ./Meditations_*.rpm`
          **Debian / Ubuntu** — `sudo apt install ./Meditations_*.deb`
          **Any distro** — `chmod +x Meditations_*.AppImage && ./Meditations_*.AppImage`
          (needs libfuse2; Fedora: `sudo dnf install fuse`, or run with `--appimage-extract-and-run`)

          Data lives in `~/.local/share/dev.journal.app/journal.db`. To import an
          existing dev database, set `MEDITATIONS_LEGACY_DB=/path/to/backend/data/journal.db`
          before first launch (stop the dev backend first — the import is skipped
          while `-wal`/`-shm` sidecars exist)."""

          releases = req(f"{api}/releases?per_page=100")
          mine = [r for r in releases if r.get("draft") and r.get("tag_name") == tag]
          release = None
          for stale in mine:  # reuse the newest draft, delete older stale ones
              if release is None:
                  release = stale
              else:
                  req(f"{api}/releases/{stale['id']}", method="DELETE")
                  print("deleted stale draft", stale["id"])
          payload = {"tag_name": tag, "name": f"Meditations {tag}", "draft": True, "body": body}
          if release is None:
              release = req(f"{api}/releases", method="POST", data=json.dumps(payload).encode(),
                            headers={**H, "Content-Type": "application/json"})
          else:
              release = req(f"{api}/releases/{release['id']}", method="PATCH",
                            data=json.dumps({"body": body, "name": f"Meditations {tag}"}).encode(),
                            headers={**H, "Content-Type": "application/json"})
          rid = release["id"]

          assets = req(f"{api}/releases/{rid}/assets")
          existing = {a["name"]: a["id"] for a in assets}
          for pattern in ("appimage/*.AppImage", "deb/*.deb", "rpm/*.rpm"):
              for path in glob.glob(f"frontend/src-tauri/target/release/bundle/{pattern}"):
                  name = os.path.basename(path)
                  if name in existing:  # replace stale asset from a previous run
                      req(f"{api}/releases/assets/{existing[name]}", method="DELETE")
                  with open(path, "rb") as f:
                      req(f"{up}/releases/{rid}/assets?name={name}", method="POST",
                          data=f.read(), headers={**H, "Content-Type": "application/octet-stream"})
                  print("uploaded", name)
          print("DRAFT READY: release id", rid)
          EOF

      - name: Build only (branch push or manual run)
        if: startsWith(github.ref, 'refs/heads/')
        # emit the build log tail as annotations (readable via the public
        # checks API when logs need admin rights); set +e so the dump runs
        # even though GitHub starts this shell with -e
        run: |
          set +e
          npm run tauri build > /tmp/build.log 2>&1
          rc=$?
          echo "build exit=$rc log_size=$(wc -c < /tmp/build.log) disk: $(df -h / | tail -1 | awk '{print $4" free"}')"
          { grep -vE "   Compiling|   Downloaded|   Blocking" /tmp/build.log | tail -c 3800
            echo "---raw tail---"
            tail -c 1400 /tmp/build.log; } | fold -w 700 | tail -9 | sed 's/^/::error::/'
          exit $rc
        working-directory: frontend

      - name: Upload build artifacts (branch push or manual run)
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
