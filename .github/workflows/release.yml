name: Release (Linux)

on:
  push:
    tags: ["app-v*"]
    branches: ["feat/backend-sidecar"] # TEMP: CI iteration for the sidecar; remove before merge
  workflow_dispatch: # build only, no release — test the pipeline before tagging

permissions:
  contents: write # create the draft release and upload bundles

jobs:
  build-linux:
    # The ubuntu-22.04 runner label is retired (Sept 2026), so run inside an
    # ubuntu:22.04 container on the current runner instead: keeps the glibc
    # 2.35 baseline for older distros and old binutils (no default .relr.dyn
    # sections, which the tauri-pinned linuxdeploy's strip cannot handle)
    runs-on: ubuntu-24.04
    container: ubuntu:22.04
    steps:
      - name: Bootstrap git + curl (minimal container image; rustup needs curl)
        run: apt-get update && apt-get install -y git curl ca-certificates

      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri

      - name: Install Tauri Linux dependencies
        run: |
          apt-get update
          apt-get install -y \
            libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libdbus-1-dev \
            libayatana-appindicator3-dev librsvg2-dev

      - name: Verify tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(node -p "require('./frontend/src-tauri/tauri.conf.json').version")
          if [ "app-v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME != app-v$version from tauri.conf.json — bump the version or re-tag."
            exit 1
          fi

      # one-dir PyInstaller bundle; must exist before tauri bundles resources
      - name: Build backend sidecar
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          export PATH="$HOME/.local/bin:$PATH"
          cd backend
          uv sync
          uv pip install pyinstaller
          uv run pyinstaller sidecar.spec --noconfirm --distpath ../frontend/src-tauri/binaries
          test -x ../frontend/src-tauri/binaries/meditations-backend/meditations-backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Build and draft release
        if: startsWith(github.ref, 'refs/tags/')
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: frontend
          tagName: ${{ github.ref_name }}
          releaseName: "Meditations ${{ github.ref_name }}"
          releaseBody: |
            Linux x86_64 builds of Meditations — the backend is bundled, no Python needed.

            **Fedora / RHEL** — `sudo dnf install ./Meditations_*.rpm`
            **Debian / Ubuntu** — `sudo apt install ./Meditations_*.deb`
            **Any distro** — `chmod +x Meditations_*.AppImage && ./Meditations_*.AppImage`
            (needs libfuse2; Fedora: `sudo dnf install fuse`, or run with `--appimage-extract-and-run`)

            Data lives in `~/.local/share/dev.journal.app/journal.db`. To import an
            existing dev database, set `MEDITATIONS_LEGACY_DB=/path/to/backend/data/journal.db`
            before first launch.
          releaseDraft: true
          prerelease: false

      - name: Build only (branch push or manual run)
        if: startsWith(github.ref, 'refs/heads/')
        run: npm run tauri build
        working-directory: frontend

      - name: Upload build artifacts (branch push or manual run)
        if: startsWith(github.ref, 'refs/heads/')
        uses: actions/upload-artifact@v4
        with:
          name: linux-bundles
          path: |
            frontend/src-tauri/target/release/bundle/appimage/*.AppImage
            frontend/src-tauri/target/release/bundle/deb/*.deb
            frontend/src-tauri/target/release/bundle/rpm/*.rpm
          if-no-files-found: error
