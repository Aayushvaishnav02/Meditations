<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181620"/>
      <stop offset="100%" stop-color="#0a090e"/>
    </linearGradient>
    <linearGradient id="page" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <linearGradient id="goldSpark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff4d0"/>
      <stop offset="45%" stop-color="#f5c042"/>
      <stop offset="100%" stop-color="#d99214"/>
    </linearGradient>
    <radialGradient id="flameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f5c042" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#f5c042" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Squircle container with hairline bevel -->
  <rect width="1024" height="1024" rx="232" fill="url(#bg)"/>
  <rect x="2.5" y="2.5" width="1019" height="1019" rx="229.5" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="5"/>

  <!-- Halo behind spark -->
  <ellipse cx="512" cy="440" rx="76" ry="132" fill="url(#flameGlow)"/>

  <!-- Left Folio Page (M Left Wing) -->
  <path d="M 304 716 L 304 452 C 304 420 336 396 364 412 L 492 488 L 492 732 L 332 732 C 316 732 304 724 304 716 Z"
        fill="url(#page)" opacity="0.92"/>

  <!-- Right Folio Page (M Right Wing) -->
  <path d="M 720 716 L 720 452 C 720 420 688 396 660 412 L 532 488 L 532 732 L 692 732 C 708 732 720 724 720 716 Z"
        fill="url(#page)" opacity="0.92"/>

  <!-- Central Thought Spark / Golden Flame -->
  <path d="M 512 272 C 532 344 556 412 512 508 C 468 412 492 344 512 272 Z"
        fill="url(#goldSpark)"/>
  <circle cx="512" cy="272" r="12" fill="#fff9e6"/>
</svg>
